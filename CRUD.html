<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Visualização - Atualização - Delação</title>
    <link rel="stylesheet" href="./style/StyleBackend.css"> 
</head>
<body>
    <header>
        <h1 style="font-size:xx-large;margin-right:auto; margin-left: auto;">C.R.U.D  via  Front End</h1>
    </header>
    <main class="container">
        <div class="d">  
            <h2>Criar Usuário</h2>
            <form id="cadastroForm">
                <label for="name" >
                    <input class="in-form" type="text" id="name" name="name" placeholder="Nome*" required>
                </label>
                <label for="email">
                    <input class="in-form" type="email" id="email" name="email" placeholder="Email*" required>
                </label>
                <label for="password">
                    <input class="in-form" type="password" id="password" name="password" placeholder="Senha*" required>
                </label>
                <button type="submit" class="btn-form">Cadastrar Usuário</button>
            </form>
            <button id="getData" class="btn-form" style="background: #22c55e; margin-top: 20px;">Visualizar Usuários <i>via console</i></button>
            <hr>
            <h2>Alterar Dados do Usuário</h2>
            <form id="altForm">
                <label for="id" >
                    <input class="in-form" type="text" id="id" name="id" placeholder="ID*" required>
                    </label>
                    <label for="name" >
                        <input class="in-form" type="text" id="name" name="name" placeholder="Nome">
                    </label>
                    <label for="email">
                        <input class="in-form" type="email" id="email" name="email" placeholder="Email">
                    </label>
                    <button type="submit" id="altData" class="btn-form">Alterar Usuário</button>
                </form>
                <hr>   
            </div>
            <div class="d">
                <h2 id="btnCarregar">Usuários Cadastrados</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaUsuarios">
                    </tbody>
                </table>        
            </div>
    </main>
    <footer>
        <p style="margin-top:18px; font-weight: 600; font-size:x-small;">© 2026 CRUD - HernandesNaWeb</p>
    </footer>
    <script>
        const cadastroForm = document.querySelector("#cadastroForm");
        const viewButton = document.querySelector("#getData");
        const altForm = document.querySelector("#altForm");
                            
        cadastroForm.addEventListener("submit", async (e) => {
    e.preventDefault();
                        
    const dataForm = Object.fromEntries(new FormData(cadastroForm));
                        
    try {
        const response = await fetch("http://localhost:3000/cadastro", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataForm)
            });

        const data = await response.json();
        console.log("Status:", response.status, "Resposta:", data);                    

            if (data.success || response.ok) {
                cadastroForm.reset(); 
                await carregarUsuarios(); 
                alert("Cadastro realizado com sucesso!");
            } else {
                alert(data.message || "Erro ao cadastrar.");
            }
            } catch (error) {
            console.error("Erro na requisição:", error);
            alert("Falha na comunicação com o servidor.");
        }
    });
    
    viewButton.addEventListener("click", async () => {               
    const response = await fetch("http://localhost:3000/usuario", {
            method: "GET",
            credentials: "include"
        });            
        const data = await response.json();
        console.log("Lista de Usuários:", data);
    });

    altForm.addEventListener("submit", async (e) => {
        e.preventDefault();
    const dataForm = Object.fromEntries(new FormData(altForm));
             
    if (!dataForm.id) {
        alert("Por favor, informe o ID do usuário.");
        return;
    }

    const dadosParaAtualizar = {};
    if (dataForm.name) dadosParaAtualizar.name = dataForm.name;
    if (dataForm.email) dadosParaAtualizar.email = dataForm.email;
            
    const response = await fetch(`http://localhost:3000/usuario/${dataForm.id}`, {
        method: "PUT",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dadosParaAtualizar)
    });
            
    const data = await response.json();
            console.log("Resposta da alteração:", data);      
    if (data.success) {
        alert("Usuário atualizado com sucesso!");
        altForm.reset(); 
        carregarUsuarios(); 
    } else {
                alert(data.message);
            }
        });
        
    const btnCarregar = document.querySelector("#btnCarregar");
    const tabela = document.querySelector("#tabelaUsuarios");
   
    async function carregarUsuarios() {
        try {  
            const response = await fetch("http://localhost:3000/usuario", {
                method: "GET",
                credentials: "include"
            });
            const resultado = await response.json();
            tabela.innerHTML = "";
            const listaUsuarios = resultado.data || resultado;
            listaUsuarios.forEach(usuario => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                <td>${usuario.id}</td>
                <td>${usuario.name}</td>
                    <td>${usuario.email}</td>
                    <td>
                        <button class="btn-delete" onclick="deletarUsuario(${usuario.id})">
                            Apagar
                            </button>
                            </td>
                            `;
                tabela.appendChild(tr);
            });
            } catch (error) {
                console.error("Erro ao carregar:", error);
                alert("Não foi possível carregar os usuários.");
            }
            }
            async function deletarUsuario(id) {
                const confirmar = confirm(`Tem certeza que deseja apagar o usuário ID ${id}?`);
                if (!confirmar) return;
                try {
                    const response = await fetch(`http://localhost:3000/usuario/${id}`, {
                        method: "DELETE",
                        credentials: "include"
                    });
                    const resultado = await response.json();
                    if (resultado.success) {
                        alert("Usuário removido com sucesso!");
                        carregarUsuarios(); 
                } else {
                    alert("Erro ao apagar: " + (resultado.message || "Falha na requisição"));
                }
                } catch (error) {
                    console.error("Erro ao deletar:", error);
                    alert("Erro ao tentar apagar o usuário.");
        }
    }
    btnCarregar.addEventListener("click", carregarUsuarios);
    carregarUsuarios();
</script>
</body>
</html>
